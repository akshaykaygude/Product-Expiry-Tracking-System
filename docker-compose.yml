version: '3.8'

services:
  expiry-tracker-app:
    build: .
    container_name: expiry_tracker_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/expiry_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LIFESPAN_THRESHOLD_DAYS=30
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: expiry_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expiry_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expiry_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
